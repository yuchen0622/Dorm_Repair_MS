{% extends 'base.html' %}

{% block title %}注册 - 宿舍报修管理系统{% endblock %}

{% block content %}
<div class="form-container">
    <h2 class="form-title">用户注册</h2>
    <form method="post" action="{% url 'users:register' %}">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="username">用户名</label>
            <input type="text" class="form-input" id="username" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="email">邮箱</label>
            <input type="email" class="form-input" id="email" name="email" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password1">密码</label>
            <input type="password" class="form-input" id="password1" name="password1" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="password2">确认密码</label>
            <input type="password" class="form-input" id="password2" name="password2" placeholder="请再次输入密码" required>
        </div>
        <div class="form-group">
            <label class="form-label" for="role">用户类型</label>
            <select class="form-select" id="role" name="role" required>
                <option value="">请选择用户类型</option>
                <option value="student">学生</option>
                <option value="worker">维修工</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label" for="phone">联系电话</label>
            <input type="tel" class="form-input" id="phone" name="phone" placeholder="请输入联系电话">
        </div>
        <button type="submit" class="btn btn-primary btn-block">注册</button>
    </form>
    <div class="form-footer">
        已有账号？<a href="{% url 'users:login' %}">立即登录</a>
    </div>
</div>
{% endblock %}
